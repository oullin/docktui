name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@v2
      - run: task release VERSION=${GITHUB_REF_NAME}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
